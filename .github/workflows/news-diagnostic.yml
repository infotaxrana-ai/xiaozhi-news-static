
name: Xiaozhi Full News Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect News Collector v4
        shell: bash
        run: |
          python - <<'PY'
          import collections
          import datetime
          import importlib.util
          import json
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          SOURCE = Path("build_news.py")
          RAW = Path("data/news.json")
          RADIO = Path("data/news_radio.json")

          def section(title):
              print("\n" + "=" * 60)
              print(title)
              print("=" * 60, flush=True)

          def show(label, value):
              print(f"{label}: {value}", flush=True)

          def load_json(path):
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  show("JSON ERROR", repr(exc))
                  return {}

          section("01 - GITHUB RUN INFORMATION")

          show(
              "UTC now",
              datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat()
          )
          show("Collector exists", SOURCE.exists())
          show("Raw JSON exists", RAW.exists())
          show("Radio JSON exists", RADIO.exists())

          if not SOURCE.exists():
              raise SystemExit("Missing build_news.py")

          spec = importlib.util.spec_from_file_location(
              "news_diagnostic_collector", SOURCE
          )
          collector = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(collector)

          show("Collector max stories",
               getattr(collector, "MAX_STORIES", "?"))
          show("Max detail characters",
               getattr(collector, "MAX_TEXT", "?"))
          show("Source definitions",
               len(collector.SOURCES))

          raw = load_json(RAW)
          radio = load_json(RADIO)

          section("02 - CURRENT PUBLISHED SOURCE COUNTS")

          for label, dataset, key in (
              ("RAW", raw, "articles"),
              ("RADIO", radio, "stories"),
          ):
              items = dataset.get(key, [])
              counts = collections.Counter(
                  x.get("source", "UNKNOWN")
                  for x in items
              )
              show(label + " total", len(items))
              show(label + " distribution", dict(counts))

          for key in (
              "collector_version",
              "generated_at",
              "articles_extracted",
              "extraction_diagnostics",
              "translation_diagnostics",
          ):
              show(key, raw.get(key))

          section("03 - FINAL RADIO QUALITY")

          stories = radio.get("stories", [])

          multi = sum(
              len(x.get("parts", [])) > 1
              for x in stories
          )
          parts = sum(
              len(x.get("parts", []))
              for x in stories
          )

          show("Radio stories", len(stories))
          show("Multi-part stories", multi)
          show("Single-part stories",
               len(stories) - multi)
          show("Total TTS parts", parts)
          show("Radio bytes",
               RADIO.stat().st_size
               if RADIO.exists() else 0)

          show("Intro URL", radio.get("intro_url"))
          show("Intro enabled",
               radio.get("anchor_intro", {}).get("enabled"))
          show("Interactive", radio.get("interactive"))
          show("Confirmation required",
               radio.get("requires_user_confirmation"))

          missing_parts = sum(
              not x.get("parts")
              for x in stories
          )
          missing_sources = sum(
              not x.get("source")
              for x in stories
          )

          show("Stories missing parts", missing_parts)
          show("Stories missing source", missing_sources)

          section("04 - RSS FEEDS AND ARTICLE COUNTS")

          source_reports = []

          for source_spec in collector.SOURCES:
              name, feed, language, domains = source_spec

              print(f"\nSOURCE: {name}", flush=True)
              show("Feed URL", feed)
              show("Language", language)
              show("Allowed domains", domains)

              try:
                  data, headers, final = collector.get(
                      feed,
                      cap=2_000_000,
                      timeout=12,
                      domains=domains
                  )

                  show("RSS HTTP", "SUCCESS")
                  show("Final RSS URL", final)
                  show("RSS bytes", len(data))
                  show("RSS content type",
                       headers.get("Content-Type"))

                  root = ET.fromstring(data)

                  items = (
                      root.findall(".//item")
                      or root.findall(
                          "{http://www.w3.org/2005/Atom}entry"
                      )
                  )

                  show("RSS total items", len(items))

                  if items:
                      sample = items[0]

                      show(
                          "Sample title",
                          collector.field(
                              sample,
                              "title",
                              "{http://www.w3.org/2005/Atom}title"
                          )[:140]
                      )

                      show(
                          "Sample date",
                          collector.field(
                              sample,
                              "pubDate",
                              "published",
                              "updated",
                              "{http://www.w3.org/2005/Atom}published",
                              "{http://www.w3.org/2005/Atom}updated"
                          )
                      )

              except urllib.error.HTTPError as exc:
                  show("RSS HTTP ERROR", exc.code)

              except Exception as exc:
                  show("RSS ERROR", repr(exc))

              try:
                  result = collector.rss(source_spec)

                  _, articles, error, rss_count = result

                  show("Collector RSS items", rss_count)
                  show("Valid recent articles", len(articles))
                  show("Collector error", error)

                  source_reports.append(
                      (name, feed, domains, articles)
                  )

              except Exception as exc:
                  show("FEED PARSER ERROR", repr(exc))
                  source_reports.append(
                      (name, feed, domains, [])
                  )

          section("05 - ARTICLE HTTP AND EXTRACTION TEST")

          http_errors = collections.Counter()
          extraction_status = collections.Counter()

          for name, feed, domains, articles in source_reports:
              print(f"\nSOURCE: {name}", flush=True)

              if not articles:
                  print("NO RECENT ARTICLES")
                  continue

              for article in articles[:4]:
                  url = article.get("url", "")
                  safe = collector.allowed(url, domains)

                  show("Title", article.get("title", "")[:100])
                  show("Host", urlparse(url).hostname)
                  show("URL allowed", safe)
                  show(
                      "RSS detail chars",
                      len(article.get("detail", ""))
                  )

                  if not safe:
                      extraction_status["unsafe_url"] += 1
                      continue

                  try:
                      data, headers, final = collector.get(
                          url,
                          cap=1_500_000,
                          timeout=9,
                          domains=domains
                      )

                      show("HTTP result", "SUCCESS")
                      show("Final URL", final)
                      show(
                          "Final URL allowed",
                          collector.allowed(final, domains)
                      )
                      show(
                          "Content type",
                          headers.get("Content-Type")
                      )
                      show("Downloaded bytes", len(data))

                      extraction_status["http_ok"] += 1

                  except urllib.error.HTTPError as exc:
                      show("HTTP ERROR CODE", exc.code)
                      http_errors[str(exc.code)] += 1

                  except Exception as exc:
                      show("HTTP ERROR", repr(exc))
                      extraction_status["http_error"] += 1

                  try:
                      body, status = collector.full_text(
                          article, domains
                      )

                      show("Extractor status", status)
                      show("Extracted chars", len(body))
                      show(
                          "Improvement possible",
                          len(body) >= (
                              len(article.get("detail", "")) + 100
                          )
                      )

                      extraction_status[status] += 1

                  except Exception as exc:
                      show("EXTRACTOR ERROR", repr(exc))
                      extraction_status["extract_crash"] += 1

          section("06 - FINAL DIAGNOSTIC SUMMARY")

          show("HTTP status counts", dict(http_errors))
          show(
              "Extractor status counts",
              dict(extraction_status)
          )

          section("07 - SOURCE POLICY REVIEW")

          english_sources = [
              name
              for name, _, language, _ in collector.SOURCES
              if language == "en"
          ]

          show("English RSS sources", english_sources)
          show(
              "Translation diagnostics",
              raw.get("translation_diagnostics", {})
          )

          counts = collections.Counter(
              x.get("source", "UNKNOWN")
              for x in stories
          )

          if stories:
              dominant, count = counts.most_common(1)[0]
              percentage = round(
                  100 * count / len(stories), 1
              )

              show("Dominant source", dominant)
              show("Dominant percentage", percentage)

              if percentage > 60:
                  print(
                      "WARNING: One source dominates "
                      "the radio. Review collector balance."
                  )

          section("08 - SAFETY REPORT")

          print("Existing news JSON modified: NO")
          print("GitHub source modified: NO")
          print("GitHub push performed: NO")
          print("ESP32 modified: NO")
          print("Firmware flash: NO")
          print("Music / Alarm / Intro changed: NO")
          print("DIAGNOSTIC COMPLETE")

          PY

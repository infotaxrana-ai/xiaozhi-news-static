
name: Refresh Xiaozhi News JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: xiaozhi-news-radio-prepare
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ARGOS_DEVICE_TYPE: cpu
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install free offline translation engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate

      - name: Collect Bengali RSS and article details
        run: python build_news.py

      - name: Translate English news to Bangla offline
        run: python translate_english_news.py

      - name: Prepare interactive Bengali news batches
        run: python prepare_news_radio.py

      - name: Validate complete news pipeline
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          raw_path = Path("data/news.json")
          radio_path = Path("data/news_radio.json")

          assert raw_path.is_file(), "news.json missing"
          assert radio_path.is_file(), "news_radio.json missing"

          raw = json.loads(raw_path.read_text(encoding="utf-8"))
          radio = json.loads(radio_path.read_text(encoding="utf-8"))

          articles = raw["articles"]
          stories = radio["stories"]

          assert articles, "No articles"
          assert stories, "No radio stories"
          assert len(stories) <= 120

          assert (
              radio["source_generated_at"] == raw["generated_at"]
          ), "Source snapshot mismatch"

          assert (
              radio["story_count"] == len(stories)
          ), "Story count mismatch"

          assert (
              radio["part_char_limit"] == 520
          ), "TTS part limit mismatch"

          expected_intro = (
              "https://raw.githubusercontent.com/"
              "infotaxrana-ai/xiaozhi-news-static/"
              "main/intro.mp3"
          )

          assert radio["intro_url"] == expected_intro

          for article in articles:
              assert article["title"]
              assert article["url"]
              assert article.get("language", "bn") == "bn"

          total_parts = 0

          for story in stories:
              assert story["title"]
              assert story["parts"]
              assert story["part_count"] == len(story["parts"])

              for part in story["parts"]:
                  assert isinstance(part, str)
                  assert 0 < len(part) <= 520
                  total_parts += 1

          assert radio_path.stat().st_size <= 340000, (
              "Radio JSON exceeds byte limit"
          )

          print("NEWS PIPELINE VALIDATION: PASS")
          print("Raw news:", len(articles))
          print("Radio stories:", len(stories))
          print("Total TTS parts:", total_parts)
          print("Radio JSON bytes:", radio_path.stat().st_size)

          print(
              "Radio sources:",
              dict(Counter(s["source"] for s in stories))
          )

          print(
              "Offline translation:",
              raw.get("offline_translation", {})
          )
          PY

      - name: Publish both JSON files safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json data/news_radio.json

          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi

          git commit -m "chore: refresh multilingual Bengali news"

          for attempt in 1 2 3; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "NEWS AND RADIO PUBLISHED"
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "Publish attempt $attempt failed"
            sleep 5
          done

          echo "ERROR: News publishing failed"
          exit 1

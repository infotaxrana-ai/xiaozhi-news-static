
name: Refresh Xiaozhi News JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: xiaozhi-news-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and publish news
        run: python build_news.py

      - name: Commit and push JSON safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/news.json ]; then
            echo "ERROR: news.json missing"
            exit 1
          fi

          git add data/news.json

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "chore: refresh RSS news snapshot"

          for attempt in 1 2 3; do
            if git pull --rebase origin main &&
               git push origin HEAD:main; then
              echo "SUCCESS: News JSON published"
              exit 0
            fi

            git rebase --abort 2>/dev/null || true

            echo "Attempt $attempt failed"
            sleep 5
          done

          echo "ERROR: News JSON publishing failed"
          exit 1
